name: Semgrep SAST
on: [push]

jobs:
  semgrep_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          docker run --rm semgrep/semgrep:latest semgrep --version
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:latest semgrep scan --config tekbook-rules.yml --error --metrics=off --json-output semgrep-report.json
      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep-report.json
